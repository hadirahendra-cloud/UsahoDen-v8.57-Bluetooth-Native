name: Build UsahoDen v8.73 - Pengeluaran Harian Bulanan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.73
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -perm /111 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager executable tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract UsahoDen ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-Halaman-Khusus-FIX.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 5 -type f -iname '*.zip' -print -quit)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP aplikasi belum ada di repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: Konfigurasi Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "Struktur proyek ditemukan."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT/gradlew" ]; then
            bash "$PROJECT/gradlew" -p "$PROJECT" \
              :app:assembleDebug --no-daemon --stacktrace
          else
            gradle -p "$PROJECT" \
              :app:assembleDebug --no-daemon --stacktrace
          fi

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan setelah build."
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          echo "Verifikasi APK berhasil."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX
          path: UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX.apk
          if-no-files-found: error
          retention-days: 30