
name: Build UsahoDen v8.94

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.94
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Source v8.94
        shell: bash
        run: |
          set -e
          ZIP="UsahoDen-v8.94-Welcome-Panel-25-Percent-Smaller-FULL-SOURCE.zip"

          if [ -f "$ZIP" ]; then
            mkdir -p extracted-source
            unzip -oq "$ZIP" -d extracted-source

            PROJECT_DIR=$(find extracted-source -type f \
              -path '*/app/build.gradle' \
              -print -quit | sed 's#/app/build.gradle##')

            test -n "$PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          fi

          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          grep -q 'v894-home-hero-quarter-smaller' \
            app/src/main/assets/index.html
          grep -q "versionName '8.94'" app/build.gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -x "$SDK/cmdline-tools/latest/bin/sdkmanager" || {
            echo "SDK manager tidak ditemukan: $SDK"
            exit 1
          }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Missing SDK Packages
        shell: bash
        run: |
          set -e
          SDK="$ANDROID_HOME"
          if [ ! -d "$SDK/platforms/android-35" ] || \
             [ ! -d "$SDK/build-tools/35.0.0" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK" --licenses || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$SDK" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "platform-tools"
          fi
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" UsahoDen-v8.94.apk

      - name: Verify APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.94
          path: UsahoDen-v8.94.apk
          if-no-files-found: error
          retention-days: 30
