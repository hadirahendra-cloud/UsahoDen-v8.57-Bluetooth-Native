name: Build UsahoDen v8.60

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build UsahoDen v8.60
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "sdkmanager:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK siap."

      - name: Cari ZIP yang BENAR
        shell: bash
        run: |
          set -e

          ZIP="./UsahoDen-v8.60-Bluetooth-Native-OPSI-DATA-BACKUP-FOLDER.zip"

          echo "Mencari ZIP:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name "*.zip" -printf "%f\n"
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

      - name: Verifikasi project Android
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android tidak ditemukan."

            echo "Isi ZIP:"
            find build-project -maxdepth 7 -type f | head -250

            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "PROJECT=$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verifikasi Native Backup Folder
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT/app/src/main/java/com/usahoden/app/MainActivity.java"
          HTML="$PROJECT/app/src/main/assets/index.html"

          echo "Memeriksa MainActivity:"
          echo "$MAIN"

          echo "Memeriksa HTML:"
          echo "$HTML"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.java tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$HTML" ]; then
            echo "ERROR: index.html tidak ditemukan."
            exit 1
          fi

          if ! grep -q "backupDataToFolder" "$MAIN"; then
            echo "ERROR: backupDataToFolder tidak ditemukan."
            exit 1
          fi

          if ! grep -q "ACTION_OPEN_DOCUMENT_TREE" "$MAIN"; then
            echo "ERROR: ACTION_OPEN_DOCUMENT_TREE tidak ditemukan."
            exit 1
          fi

          if ! grep -q "UsahoDenNative.backupDataToFolder" "$HTML"; then
            echo "ERROR: HTML belum memanggil Native Backup Folder."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "NATIVE BACKUP FOLDER TERDETEKSI"
          echo "======================================"

      - name: Cek versi aplikasi
        shell: bash
        run: |
          set -e

          echo "Versi aplikasi:"

          if [ -f "$PROJECT/app/build.gradle" ]; then
            grep -n "versionCode" "$PROJECT/app/build.gradle" || true
            grep -n "versionName" "$PROJECT/app/build.gradle" || true
          fi

          if [ -f "$PROJECT/app/build.gradle.kts" ]; then
            grep -n "versionCode" "$PROJECT/app/build.gradle.kts" || true
            grep -n "versionName" "$PROJECT/app/build.gradle.kts" || true
          fi

      - name: Build APK Debug
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MEMULAI BUILD APK"
          echo "======================================"

          cd "$PROJECT"

          echo "Project:"
          pwd

          echo ""
          echo "Isi project:"
          ls -lah

          echo ""
          echo "Menjalankan Gradle 8.7..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD APK SELESAI"

      - name: Cari APK hasil build
        shell: bash
        run: |
          set -e

          echo "Mencari APK hasil build..."

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "APK standar tidak ditemukan."

            echo "Mencari semua APK:"
            find "$PROJECT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null || true

            APK="$(find "$PROJECT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print -quit 2>/dev/null || true)"

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.60-Opsi-Data-Backup-Folder.apk"

          echo ""
          echo "File APK siap di-upload:"
          ls -lh \
            "$GITHUB_WORKSPACE/UsahoDen-v8.60-Opsi-Data-Backup-Folder.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.60-Opsi-Data-Backup-Folder
          path: UsahoDen-v8.60-Opsi-Data-Backup-Folder.apk
          if-no-files-found: error