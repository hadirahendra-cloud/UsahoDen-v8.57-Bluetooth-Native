name: Build UsahoDen v8.57 Bluetooth Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK UsahoDen v8.57
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cari project Android
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          rm -rf build-project
          mkdir build-project

          unzip -q "$ZIP" -d build-project

          PROJECT=$(find build-project -type f -name "settings.gradle" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find build-project -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT" ]; then
            echo "Project Android tidak ditemukan"
            find build-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project Android: $PROJECT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          chmod +x gradlew

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Cek APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK tidak ditemukan"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/UsahoDen-v8.57-Bluetooth-Native-debug.apk"

          ls -lh "$GITHUB_WORKSPACE/UsahoDen-v8.57-Bluetooth-Native-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.57-Bluetooth-Native-APK
          path: UsahoDen-v8.57-Bluetooth-Native-debug.apk
          if-no-files-found: error
