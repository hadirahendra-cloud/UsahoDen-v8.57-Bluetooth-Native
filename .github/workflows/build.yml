name: Build UsahoDen v8.60 Icon Splash

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build UsahoDen v8.60 Icon Splash
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          echo "Android SDK siap."

      - name: Cari ZIP Icon Splash
        shell: bash
        run: |
          set -e

          ZIP="./UsahoDen-v8.60-Icon-Splash-UsahoDen.zip"

          echo "Mencari:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP tidak ditemukan."

            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name "*.zip" -print

            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

      - name: Verifikasi Project Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find build-project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android tidak ditemukan."

            find build-project -maxdepth 7 -type f | head -250

            exit 1
          fi

          PROJECT=$(dirname "$SETTINGS")

          echo "Project Android:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verifikasi Icon Splash
        shell: bash
        run: |
          set -e

          echo "Project berhasil ditemukan."

          echo "Memeriksa AndroidManifest:"
          find "$PROJECT/app/src/main" \
            -type f \
            \( -name "AndroidManifest.xml" -o -name "*.png" -o -name "*.xml" \) \
            | head -100

      - name: Cek versi aplikasi
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT/app/build.gradle" ]; then
            echo "build.gradle:"
            grep -n "versionCode" "$PROJECT/app/build.gradle" || true
            grep -n "versionName" "$PROJECT/app/build.gradle" || true
          fi

          if [ -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "build.gradle.kts:"
            grep -n "versionCode" "$PROJECT/app/build.gradle.kts" || true
            grep -n "versionName" "$PROJECT/app/build.gradle.kts" || true
          fi

      - name: Build APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "======================================"
          echo "BUILD APK USahoDen"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "BUILD APK BERHASIL"

      - name: Cari APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK standar tidak ditemukan."

            APK=$(find "$PROJECT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print -quit)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.60-Icon-Splash-UsahoDen.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.60-Icon-Splash-UsahoDen
          path: UsahoDen-v8.60-Icon-Splash-UsahoDen.apk
          if-no-files-found: error