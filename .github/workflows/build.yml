name: "Build UsahoDen v8.78 - Perbaikan Restore Backup JSON"

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.78
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Android SDK siap."

      - name: Find and extract UsahoDen ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v8.78-Perbaikan-Restore-Backup-JSON.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP v8.78 tidak ditemukan di repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Source ditemukan: $PROJECT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"
            "$PROJECT/gradlew" -p "$PROJECT" \
              :app:assembleDebug --no-daemon --stacktrace
          else
            gradle -p "$PROJECT" \
              :app:assembleDebug --no-daemon --stacktrace
          fi

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.78-Perbaikan-Restore-Backup-JSON.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/UsahoDen-v8.78-Perbaikan-Restore-Backup-JSON.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          echo "Verifikasi APK berhasil."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.78-Perbaikan-Restore-Backup-JSON
          path: UsahoDen-v8.78-Perbaikan-Restore-Backup-JSON.apk
          if-no-files-found: error
          retention-days: 30