
name: Build APK UsahoDen v8.96

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Source
        shell: bash
        run: |
          set -e

          if [ ! -f app/build.gradle ]; then
            ZIP=$(find . -maxdepth 1 -type f \
              -name 'UsahoDen-v8.96*.zip' -print -quit)

            if [ -z "$ZIP" ]; then
              echo "ZIP source v8.96 tidak ditemukan di root repository."
              exit 1
            fi

            mkdir -p extracted-source
            unzip -oq "$ZIP" -d extracted-source

            PROJECT_DIR=$(find extracted-source -type f \
              -path '*/app/build.gradle' -print -quit |
              sed 's#/app/build.gradle##')

            test -n "$PROJECT_DIR"
            cp -a "$PROJECT_DIR"/. .
          fi

          test -s app/src/main/assets/index.html
          grep -q "versionName '8.96'" app/build.gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Check Android SDK
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Android SDK siap digunakan."

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            UsahoDen-v8.96.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.96
          path: UsahoDen-v8.96.apk
          if-no-files-found: error
          retention-days: 30
