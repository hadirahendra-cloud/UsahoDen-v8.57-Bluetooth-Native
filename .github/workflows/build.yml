name: Build UsahoDen v9.04 - About Button Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Source
        run: |
          set -e
          ZIP="UsahoDen-v9.04-About-Button-Fix.zip"
          test -f "$ZIP"
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f app/src/main/assets/index.html
          test -f app/build.gradle

      - name: Build APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk UsahoDen-v9.04-About-Button-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v9.04-About-Button-Fix
          path: UsahoDen-v9.04-About-Button-Fix.apk
          if-no-files-found: error
          retention-days: 30