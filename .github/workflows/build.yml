name: Build UsahoDen v8.84 Laporan Bisnis Modern

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.84
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Source
        shell: bash
        run: |
          set -e

          if [ ! -f app/build.gradle ]; then
            ZIP_FILE="UsahoDen-v8.84-Laporan-Bisnis-Modern-FULL-SOURCE.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "ZIP sumber v8.84 tidak ditemukan."
              echo "Upload ZIP ke repository terlebih dahulu."
              exit 1
            fi

            mkdir -p extracted-source
            unzip -oq "$ZIP_FILE" -d extracted-source

            PROJECT_DIR=$(find extracted-source \
              -type f -path '*/app/build.gradle' \
              -print -quit | sed 's#/app/build.gradle##')

            if [ -z "$PROJECT_DIR" ]; then
              echo "Proyek Android tidak ditemukan."
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Build APK
        run: |
          set -e

          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          cp "$APK" UsahoDen-v8.84-Laporan-Bisnis.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.84-Laporan-Bisnis
          path: UsahoDen-v8.84-Laporan-Bisnis.apk
          if-no-files-found: error
          retention-days: 30