
name: Build UsahoDen v8.96

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.96
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Source
        shell: bash
        run: |
          set -e
          ZIP="UsahoDen-v8.96-Fix-Printer-Buttons-Visible-FULL-SOURCE.zip"
          test -f "$ZIP"
          mkdir -p extracted-source
          unzip -oq "$ZIP" -d extracted-source

          PROJECT_DIR=$(find extracted-source -type f \
            -path '*/app/build.gradle' -print -quit |
            sed 's#/app/build.gradle##')
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .

          test -f app/src/main/assets/index.html
          grep -q 'v896-printer-picker-footer-above-bottom-tabs' \
            app/src/main/assets/index.html
          grep -q "versionName '8.96'" app/build.gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Packages
        run: |
          set -e
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            UsahoDen-v8.96.apk

      - name: Verify APK
        run: |
          apksigner verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.96
          path: UsahoDen-v8.96.apk
          if-no-files-found: error
          retention-days: 30
