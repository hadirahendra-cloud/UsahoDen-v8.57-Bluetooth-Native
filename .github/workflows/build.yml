name: Build UsahoDen v8.86

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK v8.86
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || {
            echo "Android SDK tidak ditemukan."
            exit 1
          }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Prepare Exact v8.86 Source
        run: |
          set -e
          ZIP="UsahoDen-v8.86-FIX-Logo-Beranda-Setting-FULL-SOURCE.zip"

          if [ ! -f app/build.gradle ]; then
            test -f "$ZIP" || {
              echo "Upload ZIP v8.86 ke root repository."
              exit 1
            }

            mkdir -p extracted-source
            unzip -oq "$ZIP" -d extracted-source

            DIR="extracted-source/UsahoDen-v8.86-FIX-Logo-Beranda-Setting"
            test -f "$DIR/app/build.gradle"
            cp -a "$DIR"/. .
          fi

          test -f app/src/main/assets/index.html
          grep -q 'Selamat datang kembali!' app/src/main/assets/index.html
          grep -q 'goSettingsDirect' app/src/main/assets/index.html

      - name: Check Android SDK
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Build APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" UsahoDen-v8.86.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.86
          path: UsahoDen-v8.86.apk
          if-no-files-found: error
          retention-days: 30