name: Build UsahoDen v8.87 - Fix Pengaturan Scroll

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.87
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Preinstalled Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || {
            echo "Android SDK tidak ditemukan."
            exit 1
          }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Prepare Exact v8.87 Source
        shell: bash
        run: |
          set -e
          ZIP="UsahoDen-v8.87-Fix-Scroll-Pengaturan-FULL-SOURCE.zip"

          if [ ! -f app/build.gradle ]; then
            test -f "$ZIP" || {
              echo "ZIP v8.87 belum diunggah ke root repository."
              exit 1
            }

            mkdir -p extracted-source
            unzip -oq "$ZIP" -d extracted-source

            PROJECT_DIR=$(find extracted-source -type f \
              -path '*/app/build.gradle' \
              -print -quit | sed 's#/app/build.gradle##')

            test -n "$PROJECT_DIR" || {
              echo "Proyek Android tidak ditemukan di ZIP."
              exit 1
            }

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f app/src/main/assets/index.html
          grep -q 'v887-settings-scroll-fix' \
            app/src/main/assets/index.html

      - name: Check Android SDK Packages
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "Android SDK Platform 35 tidak tersedia."
            exit 1
          }

          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo "Android Build Tools 35.0.0 tidak tersedia."
            exit 1
          }

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          cp "$APK" UsahoDen-v8.87-Fix-Scroll-Pengaturan.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.87-Fix-Scroll-Pengaturan
          path: UsahoDen-v8.87-Fix-Scroll-Pengaturan.apk
          if-no-files-found: error
          retention-days: 30