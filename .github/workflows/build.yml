
name: Build UsahoDen v8.97 - RangMudo Jr Sidebar

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.97
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extract and Verify Source
        shell: bash
        run: |
          set -e
          ZIP="UsahoDen-v8.97-RangMudo-Jr-Sidebar-FULL-SOURCE.zip"
          test -f "$ZIP" || { echo "ZIP source v8.97 tidak ditemukan di root repository."; exit 1; }
          mkdir -p extracted-source
          unzip -oq "$ZIP" -d extracted-source
          PROJECT_DIR=$(find extracted-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')
          test -n "$PROJECT_DIR" || { echo "app/build.gradle tidak ditemukan dalam ZIP."; exit 1; }
          cp -a "$PROJECT_DIR"/. .
          test -f app/src/main/assets/index.html
          grep -q 'ℜ𝔞𝔫𝔤𝔐𝔲𝔡𝔬 𝔍𝔯' app/src/main/assets/index.html
          grep -q 'v897-rangmudo-drawer-wordmark' app/src/main/assets/index.html
          grep -q "versionName '8.97'" app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" UsahoDen-v8.97-RangMudo-Jr-Sidebar.apk

      - name: Verify APK
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools/35.0.0" -type f -name apksigner | head -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.97-RangMudo-Jr-Sidebar
          path: UsahoDen-v8.97-RangMudo-Jr-Sidebar.apk
          if-no-files-found: error
          retention-days: 30
