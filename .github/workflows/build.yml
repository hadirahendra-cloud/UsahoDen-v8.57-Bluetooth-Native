
name: "Build UsahoDen v8.81 - Etalase Nama Harga Rapi"

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.81
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "ERROR: Android SDK platform 35 tidak tersedia."
            exit 1
          }

          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || {
            echo "ERROR: Android Build Tools 35.0.0 tidak tersedia."
            exit 1
          }

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v8.81-Etalase-Nama-Harga-Rapi.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP source v8.81 tidak ditemukan."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle tidak ditemukan dalam ZIP."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Source ditemukan: $PROJECT"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT/app/build.gradle" ] && \
             [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: File konfigurasi aplikasi tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT/gradlew" ]; then
            chmod +x "$PROJECT/gradlew"

            "$PROJECT/gradlew" \
              -p "$PROJECT" \
              :app:clean :app:assembleDebug \
              --no-daemon --stacktrace
          else
            gradle \
              -p "$PROJECT" \
              :app:clean :app:assembleDebug \
              --no-daemon --stacktrace
          fi

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK tidak ditemukan setelah build."
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.81-Etalase-Nama-Harga-Rapi.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/UsahoDen-v8.81-Etalase-Nama-Harga-Rapi.apk"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"

          echo "Verifikasi APK berhasil."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.81-Etalase-Nama-Harga-Rapi
          path: UsahoDen-v8.81-Etalase-Nama-Harga-Rapi.apk
          if-no-files-found: error
          retention-days: 30
