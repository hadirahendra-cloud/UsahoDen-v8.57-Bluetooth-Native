name: Build UsahoDen v9.04 Etalase Harga Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          tools: ''
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="UsahoDen-v9.04-Etalase-Harga-Fix.zip"
          test -f "$ZIP" || {
            echo "ZIP source tidak ditemukan: $ZIP"
            exit 1
          }
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted
          PROJECT_DIR=$(find extracted -type f \
            -path '*/app/build.gradle' -print -quit |
            sed 's#/app/build.gradle##')
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Set Version
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E \
            "s/versionCode [0-9]+/versionCode 904/; s/versionName '[^']+'/versionName '9.04'/" \
            app/build.gradle
          grep -q "versionCode 904" app/build.gradle
          grep -q "versionName '9.04'" app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Sign APK
        shell: bash
        env:
          KEYSTORE: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE"
          test -n "$STORE_PASS"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASS"
          printf '%s' "$KEYSTORE" |
            base64 --decode > "$RUNNER_TEMP/rangmudo-release.jks"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/rangmudo-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS \
            --key-pass env:KEY_PASS \
            --out UsahoDen-v9.04-Etalase-Harga-Fix-SIGNED.apk \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            UsahoDen-v9.04-Etalase-Harga-Fix-SIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v9.04-Etalase-Harga-Fix-SIGNED
          path: UsahoDen-v9.04-Etalase-Harga-Fix-SIGNED.apk
          if-no-files-found: error
          retention-days: 30