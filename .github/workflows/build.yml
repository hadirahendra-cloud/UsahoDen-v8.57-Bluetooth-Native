name: Build UsahoDen v8.60 FUNCTION FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK UsahoDen v8.60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cari ZIP v8.60
        shell: bash
        run: |
          set -e

          ZIP=""

          for FILE in \
            "UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX.zip" \
            "UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX (1).zip"
          do
            if [ -f "$FILE" ]; then
              ZIP="$FILE"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 2 -type f \
              -name 'UsahoDen-v8.60*.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP v8.60 TIDAK DITEMUKAN."

            echo "ZIP yang tersedia:"
            find . -maxdepth 2 -type f -name "*.zip" -print

            exit 1
          fi

          echo "ZIP YANG AKAN DIBUILD:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP v8.60
        shell: bash
        run: |
          set -e

          rm -rf build-project

          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

          echo "ZIP v8.60 berhasil diekstrak."

      - name: Cari Project Android
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-project \
            -type f \
            -name "settings.gradle" \
            -print \
            -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find build-project \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android tidak ditemukan."

            find build-project \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "PROJECT ANDROID:"
          echo "$PROJECT"

      - name: Pastikan Versi 8.60
        shell: bash
        run: |
          set -e

          echo "Memeriksa versi aplikasi..."

          grep -R \
            "versionName.*8.60" \
            "$PROJECT/app" \
            || {
              echo "ERROR: Project bukan versi 8.60."
              echo "Build dihentikan agar tidak menghasilkan APK versi lama."
              exit 1
            }

          echo "VERSI 8.60 TERKONFIRMASI."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Cek APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            find "$PROJECT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK v8.60 berhasil dibuat:"
          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.60-FUNCTION-FIX.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.60-FUNCTION-FIX
          path: UsahoDen-v8.60-FUNCTION-FIX.apk
          if-no-files-found: error