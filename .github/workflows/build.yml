
name: Build UsahoDen v9.04 Customer Sticky Compact v3

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK Customer Sticky v3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and Prepare Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="UsahoDen-v9.04-Data-Customer-Sticky-Compact-Title-v3.zip"

          ZIP_FILE="$(find . -type f -name "$ZIP_NAME" \
            -not -path './extracted-source/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP tidak ditemukan: $ZIP_NAME"
            echo "ZIP yang tersedia di repository:"
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          mkdir -p extracted-source
          unzip -oq "$ZIP_FILE" -d extracted-source

          PROJECT_DIR="$(find extracted-source -type f \
            -path '*/app/build.gradle' \
            -print -quit | sed 's#/app/build.gradle##')"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted-source -type f \
              -path '*/app/build.gradle.kts' \
              -print -quit | sed 's#/app/build.gradle.kts##')"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Folder proyek Android tidak ditemukan di ZIP."
            find extracted-source -maxdepth 5 -type f -print | head -100
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

          if [ ! -f app/src/main/assets/index.html ]; then
            echo "::error::File app/src/main/assets/index.html tidak ditemukan."
            exit 1
          fi

          if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
            echo "::error::File Gradle aplikasi tidak ditemukan."
            exit 1
          fi

          echo "Source berhasil disiapkan."
          echo "Proyek: $PROJECT_DIR"

      - name: Set Version 9.04
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/build.gradle ]; then
            FILE="app/build.gradle"
          else
            FILE="app/build.gradle.kts"
          fi

          if grep -qE 'versionCode[[:space:]]*=' "$FILE"; then
            sed -i -E \
              's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 904/' "$FILE"
          else
            sed -i -E \
              's/versionCode[[:space:]]+[0-9]+/versionCode 904/' "$FILE"
          fi

          if grep -qE 'versionName[[:space:]]*=' "$FILE"; then
            sed -i -E \
              's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "9.04"/' "$FILE"
          else
            sed -i -E \
              "s/versionName[[:space:]]+['\"][^'\"]*['\"]/versionName '9.04'/" "$FILE"
          fi

          grep -nE 'applicationId|versionCode|versionName' "$FILE"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK tidak berhasil dibuat."
            exit 1
          fi

          cp "$APK" UsahoDen-v9.04-Data-Customer-Sticky-Compact-v3.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v9.04-Data-Customer-Sticky-Compact-v3
          path: UsahoDen-v9.04-Data-Customer-Sticky-Compact-v3.apk
          if-no-files-found: error
          retention-days: 30
