name: Build UsahoDen v8.60 Splash 3 Detik

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build UsahoDen v8.60 Splash 3 Detik
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          echo "Android SDK siap."

      - name: Cari ZIP Splash 3 Detik
        shell: bash
        run: |
          set -e

          ZIP="./UsahoDen-v8.60-Icon-Splash-UsahoDen-3Detik.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP utama tidak ditemukan."

            ZIP="$(find . -maxdepth 1 -type f \
              -name 'UsahoDen-v8.60-Icon-Splash-UsahoDen-3Detik*.zip' \
              -print -quit)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP Splash 3 Detik tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP yang digunakan:"
          ls -lh "$ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

      - name: Cari Project Android
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            find build-project -maxdepth 7 -type f | head -250
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verifikasi Project
        shell: bash
        run: |
          set -e

          echo "Project Android:"
          echo "$PROJECT"

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: Folder app tidak ditemukan."
            exit 1
          fi

          echo "Folder app OK."

      - name: Verifikasi Splash
        shell: bash
        run: |
          set -e

          echo "Memeriksa file aplikasi..."

          find "$PROJECT/app/src/main" \
            -type f \
            | head -150

          echo "Project Splash 3 Detik siap dibuild."

      - name: Cek Versi
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT/app/build.gradle" ]; then
            grep -n "versionCode" "$PROJECT/app/build.gradle" || true
            grep -n "versionName" "$PROJECT/app/build.gradle" || true
          fi

          if [ -f "$PROJECT/app/build.gradle.kts" ]; then
            grep -n "versionCode" "$PROJECT/app/build.gradle.kts" || true
            grep -n "versionName" "$PROJECT/app/build.gradle.kts" || true
          fi

      - name: Build APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "================================"
          echo "BUILD USahoDen v8.60"
          echo "SPLASH 3 DETIK"
          echo "================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "BUILD APK BERHASIL."

      - name: Cari APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            APK="$(find "$PROJECT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.60-Splash-3-Detik.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.60-Splash-3-Detik
          path: UsahoDen-v8.60-Splash-3-Detik.apk
          if-no-files-found: error