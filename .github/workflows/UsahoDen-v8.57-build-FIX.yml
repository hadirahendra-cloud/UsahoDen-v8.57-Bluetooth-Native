name: Build UsahoDen v8.57 Bluetooth Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK UsahoDen v8.57
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          set -e
          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            PROJECT_DIR="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts -o -path '*/app/build.gradle' -o -path '*/app/build.gradle.kts' \) -print -quit | xargs -r dirname)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "Android project tidak ditemukan."
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew tidak ditemukan."
            exit 1
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Check APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi
          echo "APK ditemukan: $APK"

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          cp "$APK" "$GITHUB_WORKSPACE/UsahoDen-v8.57-Bluetooth-Native-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.57-Bluetooth-Native
          path: UsahoDen-v8.57-Bluetooth-Native-debug.apk
          if-no-files-found: error
