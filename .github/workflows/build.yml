name: Build UsahoDen v9.03 - RangMudo Jr Signed

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build and sign APK v9.03
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Prepare Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-35
        build-tools;35.0.0
      accept-android-sdk-licenses: true

  - name: Verify Android SDK
    shell: bash
    run: |
      set -euo pipefail
      test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      echo "Android SDK siap."

  - name: Prepare Source
    shell: bash
    run: |
      set -euo pipefail
      ZIP="UsahoDen-v9.01-RangMudo-Jr-Full-Customer-Names.zip"
      test -f "$ZIP" || {
        echo "ZIP sumber tidak ditemukan: $ZIP"
        exit 1
      }

      mkdir -p extracted-source
      unzip -oq "$ZIP" -d extracted-source

      PROJECT_DIR=$(find extracted-source -type f -path '*/app/build.gradle' -print -quit | sed 's#/app/build.gradle##')
      test -n "$PROJECT_DIR" || {
        echo "Folder proyek Android tidak ditemukan dalam ZIP."
        exit 1
      }

      cp -a "$PROJECT_DIR"/. .

      test -f app/src/main/assets/index.html
      grep -q 'v9.01-rangmudo-full-customer-names' app/src/main/assets/index.html
      grep -q "applicationId 'com.usahoden.app'" app/build.gradle

      sed -i "s/versionCode 901/versionCode 903/; s/versionName '9.01'/versionName '9.03'/" app/build.gradle

      grep -q "versionCode 903" app/build.gradle
      grep -q "versionName '9.03'" app/build.gradle

  - name: Build APK
    shell: bash
    run: |
      set -euo pipefail
      gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
      test -s app/build/outputs/apk/debug/app-debug.apk

  - name: Sign APK
    shell: bash
    env:
      TOKOKU_KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
      TOKOKU_KEYSTORE_PASSWORD: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
      TOKOKU_KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
      TOKOKU_KEY_PASSWORD: ${{ secrets.TOKOKU_KEY_PASSWORD }}
    run: |
      set -euo pipefail

      test -n "$TOKOKU_KEYSTORE_BASE64" || {
        echo "Secret TOKOKU_KEYSTORE_BASE64 belum diisi."
        exit 1
      }
      test -n "$TOKOKU_KEYSTORE_PASSWORD" || {
        echo "Secret TOKOKU_KEYSTORE_PASSWORD belum diisi."
        exit 1
      }
      test -n "$TOKOKU_KEY_ALIAS" || {
        echo "Secret TOKOKU_KEY_ALIAS belum diisi."
        exit 1
      }
      test -n "$TOKOKU_KEY_PASSWORD" || {
        echo "Secret TOKOKU_KEY_PASSWORD belum diisi."
        exit 1
      }

      printf '%s' "$TOKOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rangmudo-release.jks"

      "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
        --ks "$RUNNER_TEMP/rangmudo-release.jks" \
        --ks-key-alias "$TOKOKU_KEY_ALIAS" \
        --ks-pass env:TOKOKU_KEYSTORE_PASSWORD \
        --key-pass env:TOKOKU_KEY_PASSWORD \
        --out UsahoDen-v9.03-RangMudo-Jr.apk \
        app/build/outputs/apk/debug/app-debug.apk

      "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs UsahoDen-v9.03-RangMudo-Jr.apk

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: UsahoDen-v9.03-RangMudo-Jr-SIGNED
      path: UsahoDen-v9.03-RangMudo-Jr.apk
      if-no-files-found: error
      retention-days: 30