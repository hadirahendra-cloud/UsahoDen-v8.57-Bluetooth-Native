name: Build UsahoDen v8.59 SYSTEM BAR FIX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK UsahoDen v8.59
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER=""

          if [ -n "${ANDROID_HOME:-}" ]; then
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK siap."

      - name: Ambil ZIP v8.59
        shell: bash
        run: |
          set -e

          ZIP="UsahoDen-v8.59-Bluetooth-Native-SYSTEM-BAR-FIX.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP tidak ditemukan."
            echo "Daftar file ZIP:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP yang digunakan:"
          echo "$ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

      - name: Cari project Android
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-project \
            -type f \
            -name "settings.gradle" \
            -print \
            -quit)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find build-project \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            find build-project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project Android:"
          echo "$PROJECT"

      - name: Build APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Cek APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            find "$PROJECT/app/build/outputs" \
              -type f \
              -name "*.apk" \
              -print \
              2>/dev/null || true

            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.59-SYSTEM-BAR-FIX-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.59-SYSTEM-BAR-FIX
          path: UsahoDen-v8.59-SYSTEM-BAR-FIX-debug.apk
          if-no-files-found: error