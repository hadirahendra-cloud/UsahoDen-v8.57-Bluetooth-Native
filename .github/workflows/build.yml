name: Build UsahoDen v8.83 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build APK UsahoDen v8.83

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK tidak ditemukan: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK ditemukan: $SDK"

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan."
            exit 1
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager tidak memiliki izin eksekusi."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Source
        shell: bash
        run: |
          set -e

          if [ ! -f app/build.gradle ]; then
            ZIP_FILE=$(find . -maxdepth 4 -type f \
              -name 'UsahoDen-v8.83-Desain-Beranda-Sesuai-Acuan-FULL-SOURCE.zip' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ZIP sumber v8.83 belum ada di repository."
              exit 1
            fi

            mkdir -p extracted-source
            unzip -oq "$ZIP_FILE" -d extracted-source

            PROJECT_DIR=$(find extracted-source -type f \
              -path '*/app/build.gradle' \
              -print -quit | sed 's#/app/build.gradle##')

            if [ -z "$PROJECT_DIR" ]; then
              echo "Proyek Android tidak ditemukan dalam ZIP."
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          cp "$APK" UsahoDen-v8.83-Premium-Home.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          test -x "$APKSIGNER"
          "$APKSIGNER" verify \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.83-Premium-Home
          path: UsahoDen-v8.83-Premium-Home.apk
          if-no-files-found: error
          retention-days: 30