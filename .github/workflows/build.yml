
name: Build UsahoDen v8.99 - RangMudo Jr Header FIX

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK v8.99
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="UsahoDen-v8.99-RangMudo-Jr-Header-FIX.zip"
          test -f "$ZIP" || {
            echo "ZIP source tidak ditemukan: $ZIP"
            exit 1
          }

          mkdir -p extracted-source
          unzip -oq "$ZIP" -d extracted-source

          PROJECT_DIR=$(find extracted-source -type f \
            -path '*/app/build.gradle' -print -quit |
            sed 's#/app/build.gradle##')

          test -n "$PROJECT_DIR" || {
            echo "app/build.gradle tidak ditemukan"
            exit 1
          }

          cp -a "$PROJECT_DIR"/. .

          test -f app/src/main/assets/index.html
          grep -q 'v8.99-rangmudo-header-title-fix' \
            app/src/main/assets/index.html

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" UsahoDen-v8.99-RangMudo-Jr-Header-FIX.apk

      - name: Verify APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.99-RangMudo-Jr-Header-FIX
          path: UsahoDen-v8.99-RangMudo-Jr-Header-FIX.apk
          if-no-files-found: error
          retention-days: 30
