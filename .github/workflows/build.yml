
name: Build UsahoDen v9.04 Multiwarna

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK Multiwarna
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Source
        shell: bash
        run: |
          set -e
          ZIP_FILE="UsahoDen-v9.04-Etalase-Harga-Multiwarna.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP tidak ditemukan: $ZIP_FILE"
            echo "File ZIP yang tersedia:"
            ls -lah *.zip || true
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR="$(find source -type f \
            \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            -print -quit | xargs -r dirname | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Folder proyek Android tidak ditemukan di dalam ZIP."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Check Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "Android SDK: $SDK"
          ls -la "$SDK"
          ls -la "$SDK/platform-tools"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Check APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -name '*debug*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK debug tidak ditemukan."
            find "$PROJECT_DIR" -path '*/build/outputs/apk/*' -type f
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/UsahoDen-v9.04-Multiwarna-debug.apk
          echo "APK berhasil ditemukan."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v9.04-Multiwarna
          path: output/UsahoDen-v9.04-Multiwarna-debug.apk
          if-no-files-found: error
