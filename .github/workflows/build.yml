
name: Build UsahoDen v9.02 - RangMudo Jr

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build APK v9.02
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || {
            echo "Android SDK tidak ditemukan: $SDK"
            exit 1
          }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            test -n "$SDKMANAGER" || {
              echo "SDK Manager tidak ditemukan."
              exit 1
            }
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
            "$SDKMANAGER" --sdk_root="$SDK" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
          fi
          test -x "$SDK/build-tools/35.0.0/apksigner"
          echo "Android SDK siap."

      - name: Prepare Source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="UsahoDen-v9.01-RangMudo-Jr-Full-Customer-Names.zip"
          test -f "$ZIP" || {
            echo "ZIP source tidak ditemukan: $ZIP"
            exit 1
          }
          mkdir -p extracted-source
          unzip -oq "$ZIP" -d extracted-source
          PROJECT_DIR=$(find extracted-source -type f \
            -path '*/app/build.gradle' -print -quit |
            sed 's#/app/build.gradle##')
          test -n "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. .
          test -f app/src/main/assets/index.html
          grep -q 'v9.01-rangmudo-full-customer-names' \
            app/src/main/assets/index.html
          grep -q "applicationId 'com.usahoden.app'" app/build.gradle
          sed -i "s/versionCode 901/versionCode 902/; s/versionName '9.01'/versionName '9.02'/" app/build.gradle
          grep -q "versionCode 902" app/build.gradle
          grep -q "versionName '9.02'" app/build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" UsahoDen-v9.02-RangMudo-Jr.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v9.02-RangMudo-Jr
          path: UsahoDen-v9.02-RangMudo-Jr.apk
          if-no-files-found: error
          retention-days: 30
