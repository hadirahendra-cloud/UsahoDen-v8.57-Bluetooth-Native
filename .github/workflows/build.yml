name: Build UsahoDen v8.84 Laporan Modern

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.84
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use Preinstalled Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK/platforms/android-35" ]; then
            echo "Android SDK Platform 35 tidak tersedia: $SDK"
            exit 1
          fi

          if [ ! -d "$SDK/build-tools/35.0.0" ]; then
            echo "Android Build Tools 35.0.0 tidak tersedia."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK siap digunakan."

      - name: Prepare Source
        shell: bash
        run: |
          set -e

          if [ ! -f app/build.gradle ]; then
            ZIP_FILE="UsahoDen-v8.84-Laporan-Bisnis-Modern-FULL-SOURCE.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "ZIP sumber v8.84 tidak ditemukan di repository."
              exit 1
            fi

            mkdir -p extracted-source
            unzip -oq "$ZIP_FILE" -d extracted-source

            PROJECT_DIR=$(find extracted-source -type f \
              -path '*/app/build.gradle' \
              -print -quit | sed 's#/app/build.gradle##')

            if [ -z "$PROJECT_DIR" ]; then
              echo "Proyek Android tidak ditemukan dalam ZIP."
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle :app:clean :app:assembleDebug \
            --no-daemon --stacktrace

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          cp "$APK" UsahoDen-v8.84-Laporan-Bisnis.apk

      - name: Verify APK
        shell: bash
        run: |
          set -e
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.84-Laporan-Bisnis
          path: UsahoDen-v8.84-Laporan-Bisnis.apk
          if-no-files-found: error
          retention-days: 30