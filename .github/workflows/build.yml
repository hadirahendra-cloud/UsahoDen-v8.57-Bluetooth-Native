name: Build UsahoDen v8.73 - Riwayat Pengeluaran Halaman Khusus

on:
workflow_dispatch:
push:
branches: [ main ]

permissions:
contents: read

jobs:
build:
name: Build APK UsahoDen v8.73
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install SDK packages
    shell: bash
    run: |
      set -euo pipefail
      yes | sdkmanager --licenses >/dev/null 2>&1 || true
      sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Verify source and version
    shell: bash
    run: |
      set -euo pipefail
      test -f app/src/main/assets/index.html
      grep -q "function expenseOpenHistory" app/src/main/assets/index.html
      grep -q "function expenseOpenMonth" app/src/main/assets/index.html
      grep -q "function expenseOpenDate" app/src/main/assets/index.html
      grep -q "versionName '8.73'" app/build.gradle
      echo "Source riwayat halaman khusus v8.73 terverifikasi."

  - name: Build APK
    shell: bash
    run: |
      set -euo pipefail
      gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
      test -s app/build/outputs/apk/debug/app-debug.apk
      cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX.apk"

  - name: Verify APK
    shell: bash
    run: |
      set -euo pipefail
      "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "versionName='8.73'"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX
      path: UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-FIX.apk
      if-no-files-found: error
      retention-days: 30