name: Build UsahoDen v8.91 - Payment Scroll Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.91
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare v8.91 Source
        shell: bash
        run: |
          set -e
          ZIP="UsahoDen-v8.91-Fix-Pembayaran-Scroll-FULL-SOURCE.zip"

          if [ -f "$ZIP" ]; then
            rm -rf extracted-source
            mkdir -p extracted-source
            unzip -oq "$ZIP" -d extracted-source

            PROJECT_DIR=$(find extracted-source -type f \
              -path '*/app/build.gradle' \
              -print -quit | sed 's#/app/build.gradle##')

            test -n "$PROJECT_DIR" || {
              echo "Proyek Android tidak ditemukan dalam ZIP."
              exit 1
            }

            cp -a "$PROJECT_DIR"/. .
          elif [ ! -f app/build.gradle ]; then
            echo "ZIP v8.91 tidak ditemukan di root repository."
            exit 1
          fi

          test -f app/src/main/assets/index.html
          grep -q 'v891-payment-scroll-fix' app/src/main/assets/index.html
          grep -q "versionName '8.91'" app/build.gradle

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || {
            echo "Android SDK tidak ditemukan."
            exit 1
          }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Check Android SDK Packages
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "Android SDK Platform 35 tidak tersedia."
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo "Android Build Tools 35.0.0 tidak tersedia."
            exit 1
          }

      - name: Build APK
        shell: bash
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" UsahoDen-v8.91-Pembayaran-Scroll-Fix.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.91-Pembayaran-Scroll-Fix
          path: UsahoDen-v8.91-Pembayaran-Scroll-Fix.apk
          if-no-files-found: error
          retention-days: 30