name: Build UsahoDen v8.73 - Pengeluaran Harian Bulanan

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.73
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract UsahoDen ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 5 -type f \
            -iname 'UsahoDen-v8.73-Pengeluaran-Harian-Bulanan-Halaman-Khusus-FIX.zip' \
            -print -quit)

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 5 -type f \
              -iname '*.zip' -print -quit)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP aplikasi belum ada di repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -