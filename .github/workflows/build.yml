name: Build UsahoDen v8.83 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK UsahoDen v8.83
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and Prepare Source
        shell: bash
        run: |
          set -e

          if [ ! -f app/build.gradle ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              -name 'UsahoDen-v8.83-Desain-Beranda-Sesuai-Acuan-FULL-SOURCE.zip' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE=$(find . -maxdepth 3 -type f \
                -name '*.zip' -print -quit)
            fi

            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted-source
              unzip -oq "$ZIP_FILE" -d extracted-source
            fi

            PROJECT_DIR=$(find . -type f \
              -path '*/app/build.gradle' \
              -not -path './.gradle/*' \
              -print -quit | sed 's#/app/build.gradle##')

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Proyek Android tidak ditemukan."
              exit 1
            fi

            if [ "$PROJECT_DIR" != "." ]; then
              cp -a "$PROJECT_DIR"/. .
            fi
          fi

          test -f app/build.gradle
          test -f app/src/main/assets/index.html

      - name: Build Debug APK
        run: |
          set -e
          gradle :app:clean :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk \
            UsahoDen-v8.83-Premium-Home.apk

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.83-Premium-Home
          path: UsahoDen-v8.83-Premium-Home.apk
          if-no-files-found: error
          retention-days: 30