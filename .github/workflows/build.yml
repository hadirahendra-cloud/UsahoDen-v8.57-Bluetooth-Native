name: Build UsahoDen v8.62 Edit Produk Lengkap

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK UsahoDen v8.62
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"

          echo "Android SDK siap."

      - name: Cari ZIP v8.62
        shell: bash
        run: |
          set -e

          ZIP="./UsahoDen-v8.62-Edit-Produk-Lengkap.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP v8.62 tidak ditemukan."
            echo "ZIP yang tersedia:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "ZIP yang digunakan:"
          ls -lh "$ZIP"

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

          echo "ZIP berhasil diekstrak."

      - name: Cari Project Android
        shell: bash
        run: |
          set -e

          SETTINGS="$(find build-project -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            find build-project -maxdepth 7 -type f | head -250
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"
          echo "Project Android: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verifikasi Project
        shell: bash
        run: |
          set -e

          if [ ! -d "$PROJECT/app" ]; then
            echo "ERROR: Folder app tidak ditemukan."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          echo "Project Android siap."

      - name: Build APK Debug
        shell: bash
        run: |
          set -e
          cd "$PROJECT"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Build APK berhasil."

      - name: Siapkan APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            APK="$(find "$PROJECT/app/build/outputs" \
              -type f -name "*.apk" \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.62-Edit-Produk-Lengkap.apk"

          ls -lh "$GITHUB_WORKSPACE/UsahoDen-v8.62-Edit-Produk-Lengkap.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.62-Edit-Produk-Lengkap
          path: UsahoDen-v8.62-Edit-Produk-Lengkap.apk
          if-no-files-found: error
          retention-days: 7