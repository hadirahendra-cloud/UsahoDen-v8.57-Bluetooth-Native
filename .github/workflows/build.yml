name: Build UsahoDen v8.60 Bluetooth Native

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK UsahoDen v8.60
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "Mencari Android SDK..."

          if [ -d "$ANDROID_HOME" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          echo "SDK_ROOT=$SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan"
            exit 1
          fi

          echo "sdkmanager ditemukan:"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK berhasil disiapkan."

      - name: Cari ZIP UsahoDen v8.60
        shell: bash
        run: |
          set -e

          echo "Mencari ZIP project..."

          ZIP="$(find . -maxdepth 1 -type f \
            \( -name 'UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX.zip' \
            -o -name 'UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX (1).zip' \
            -o -name 'UsahoDen-v8.60*.zip' \) \
            -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP UsahoDen v8.60 tidak ditemukan."
            echo "File yang ada di repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP" -d build-project

          echo "Mencari project Android..."

          PROJECT=""

          SETTINGS="$(find build-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android tidak ditemukan."
            echo "Isi ZIP:"
            find build-project -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "PROJECT=$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Cek versi aplikasi
        shell: bash
        run: |
          set -e

          echo "Memeriksa versi aplikasi..."

          if [ -f "$PROJECT/app/build.gradle" ]; then
            grep -n "versionName" "$PROJECT/app/build.gradle" || true
          fi

          if [ -f "$PROJECT/app/build.gradle.kts" ]; then
            grep -n "versionName" "$PROJECT/app/build.gradle.kts" || true
          fi

      - name: Build APK Debug
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          echo "Project:"
          pwd

          echo "Isi project:"
          ls -lah

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Cari APK hasil build
        shell: bash
        run: |
          set -e

          echo "Mencari APK..."

          APK="$(find "$PROJECT/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo "Isi folder output:"
            find "$PROJECT/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX
          path: UsahoDen-v8.60-Bluetooth-Native-FUNCTION-FIX.apk
          if-no-files-found: error