
name: Build UsahoDen v9.04 Data Customer Scroll Fix v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="UsahoDen-v9.04-Data-Customer-Scroll-Fix-v2.zip"
          ZIP_FILE="$(find . -type f -name "$ZIP_NAME" \
            -not -path './source/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP tidak ditemukan: $ZIP_NAME"
            echo "ZIP yang tersedia:"
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source

          GRADLE_FILE="$(find source -type f \
            \( -path '*/app/build.gradle' \
            -o -path '*/app/build.gradle.kts' \) \
            -print -quit)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::File app/build.gradle tidak ditemukan."
            find source -maxdepth 5 -type f -print | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$GRADLE_FILE")")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "GRADLE_FILE=$GRADLE_FILE" >> "$GITHUB_ENV"

          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Set Version 9.04
        shell: bash
        run: |
          set -euo pipefail
          FILE="$GRADLE_FILE"

          if grep -qE 'versionCode[[:space:]]*=' "$FILE"; then
            sed -i -E \
              's/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = 904/' "$FILE"
          else
            sed -i -E \
              's/versionCode[[:space:]]+[0-9]+/versionCode 904/' "$FILE"
          fi

          if grep -qE 'versionName[[:space:]]*=' "$FILE"; then
            sed -i -E \
              's/versionName[[:space:]]*=[[:space:]]*"[^"]*"/versionName = "9.04"/' "$FILE"
          else
            sed -i -E \
              "s/versionName[[:space:]]+['\"][^'\"]*['\"]/versionName '9.04'/" "$FILE"
          fi

          grep -nE 'applicationId|versionCode|versionName' "$FILE"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Decode Existing Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TOKOKU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret TOKOKU_KEYSTORE_BASE64 kosong."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/usahoden.jks"

          test -s "$RUNNER_TEMP/usahoden.jks"

      - name: Sign and Verify APK
        shell: bash
        env:
          KS_PASS: ${{ secrets.TOKOKU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOKOKU_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TOKOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Secret password atau alias keystore kosong."
            exit 1
          fi

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK hasil build tidak ditemukan."
            exit 1
          fi

          mkdir -p output

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/usahoden.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out output/UsahoDen-v9.04-Data-Customer-Scroll-Fix-v2-SIGNED.apk \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs \
            output/UsahoDen-v9.04-Data-Customer-Scroll-Fix-v2-SIGNED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UsahoDen-v9.04-Data-Customer-Scroll-Fix-v2-SIGNED
          path: output/UsahoDen-v9.04-Data-Customer-Scroll-Fix-v2-SIGNED.apk
          if-no-files-found: error
